name: G5-B Apply and Validate

on:
  push:
    branches:
      - feature/m0-g5-expansion-confinement

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - name: Checkout G5-B branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply G5-B implementation
        run: python tools/g5b_apply.py

      - name: Correct WGSL reserved identifier
        run: python tools/g5b_fix_reserved.py

      - name: Format Rust
        run: cargo fmt --all

      - name: Core regression
        run: cargo test -p powdergame-core

      - name: Parse all production WGSL
        run: cargo test -p powdergame-gpu --test wgsl_parse -- --nocapture

      - name: Compile workspace all targets
        run: cargo check --workspace --all-targets

      - name: Diff sanity
        shell: bash
        run: git diff --check

      - name: Remove temporary validation helpers
        shell: bash
        run: git rm tools/g5b_apply.py tools/g5b_fix_reserved.py .github/workflows/g5b-apply-and-validate.yml

      - name: Commit validated G5-B implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement G5-B expansion and confinement pressure"
          git push origin HEAD:feature/m0-g5-expansion-confinement
