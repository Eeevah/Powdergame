[workspace]
resolver = "2"
members = [
    "engine/core",
    "engine/gpu",
    "apps/windows",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
powdergame-core = { path = "engine/core" }
powdergame-gpu = { path = "engine/gpu" }
wgpu = "26"
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
